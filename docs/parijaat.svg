<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Parijaat (night-flowering jasmine) on a flat mud-brown background. The background is
       full-bleed so Android can mask the icon to any shape; the flower stays inside the central
       safe zone (radius ~205) that every mask keeps. -->
  <rect width="512" height="512" fill="#6f4a2d"/>

  <!-- Orange tube, behind the petals -->
  <path d="M256 250 C 270 310, 292 360, 318 412" stroke="#e8650f" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M256 250 C 268 304, 286 352, 308 398" stroke="#f5892a" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Seven white petals, each leaning the same way (pinwheel) with a notched tip -->
  <g fill="#fffaf1" stroke="#e7d8c3" stroke-width="3" stroke-linejoin="round">
    <path id="petal" d="M256 244 C 226 212, 226 150, 250 112 L 264 128 L 280 114 C 296 158, 288 214, 256 244 Z"/>
    <use href="#petal" transform="rotate(51.43 256 244)"/>
    <use href="#petal" transform="rotate(102.86 256 244)"/>
    <use href="#petal" transform="rotate(154.29 256 244)"/>
    <use href="#petal" transform="rotate(205.71 256 244)"/>
    <use href="#petal" transform="rotate(257.14 256 244)"/>
    <use href="#petal" transform="rotate(308.57 256 244)"/>
  </g>

  <!-- Orange eye -->
  <circle cx="256" cy="244" r="20" fill="#e8650f"/>
  <circle cx="256" cy="244" r="9" fill="#c94f08"/>
</svg>
